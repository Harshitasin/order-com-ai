[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-assistant"
version = "0.1.0"
description = "LLM customer-support assistant (Groq) for order and shipment tracking, with per-customer data isolation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["llm", "groq", "flask", "mysql", "tool-calling", "customer-support", "jwt"]
dependencies = [
    "flask>=3.0",
    "pymysql>=1.1",
    "python-dotenv>=1.0",
    "groq>=0.11",                                  # LLM provider (free tier available)
    "werkzeug>=3.0",
    "flask-jwt-extended>=4.6",
    "flask-limiter>=3.5",
    "gunicorn>=22; sys_platform != 'win32'",       # production server (not available on Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8", "faker>=24"]                   # tests + seed script
eval = ["scikit-learn>=1.4", "pandas>=2.1", "matplotlib>=3.8"]   # eval/ scripts only

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
order_assistant = ["api/static/*"]                 # ship the chat UI inside the package

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs a running MySQL with seeded data (auto-skipped otherwise)"]
