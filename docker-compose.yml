# Run the whole stack:   docker compose up --build -d
# Load demo data once:   docker compose run --rm app python scripts/seed_data.py
# Open:                  http://localhost:8000
services:
  db:
    image: mysql:8.0
    env_file: .env                       # needs MYSQL_ROOT_PASSWORD and the DB_*_PASS values
    environment:
      MYSQL_DATABASE: shop
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docker/mysql-init/02_users.sh:/docker-entrypoint-initdb.d/02_users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No "ports:" on purpose: the database is reachable only from the app container.

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db                        # inside Docker the database host is the service name
      DB_PORT: "3306"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
